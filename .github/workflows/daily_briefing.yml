name: J.A.R.V.I.S. Daily Briefing

on:
  schedule:
    - cron: '0 4 * * *' # 06:00 AM CEST (04:00 UTC)
  workflow_dispatch: # Permette di avviarlo a mano con un click

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
          
      - name: 🛡️ Pre-Flight Quality Checks & Tests
        run: |
          ruff check .
          pytest tests/
          python -m src.evaluation.eval_smoke
          
      - name: Run J.A.R.V.I.S. Orchestrator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.orchestrator
        
      - name: Commit and Push Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git commit -m "🤖 J.A.R.V.I.S.: Daily Intelligence Update" || exit 0
          git push