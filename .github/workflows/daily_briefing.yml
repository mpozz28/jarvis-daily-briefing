name: J.A.R.V.I.S. Autonomous Daily Briefing

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC (06:00 CET/CEST)
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Orchestrator (Data Generation & JSON Export)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.orchestrator

      - name: Commit and Push New Intelligence
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Bot]"
          git add data/jarvis_memory.db
          git add data/source_cache/
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 J.A.R.V.I.S.: Morning intelligence briefing & memory sync [skip ci]"
          git push