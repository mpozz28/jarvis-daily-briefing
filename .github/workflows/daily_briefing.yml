name: J.A.R.V.I.S. Daily Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
          
      - name: Code Quality (Ruff)
        run: ruff check . --output-format=github
        continue-on-error: false
        
      - name: Unit & Security Tests (Pytest)
        run: pytest tests/
        
      - name: Evaluation Smoke Test
        run: python -m src.evaluation.eval_smoke
        
      - name: Run J.A.R.V.I.S. Orchestrator
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # Esegui API costose solo su schedule/dispatch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.orchestrator
        
      - name: Deploy to Pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git commit -m "🤖 J.A.R.V.I.S.: Daily Intelligence Update" || exit 0
          git push